services:
  connext:
    build:
      context: .
      dockerfile: docker/connext-7.7/Dockerfile
      network: host
      args:
        CONNEXT_VERSION: "7.7.0"
        CONNEXTDDS_ARCH: x64Linux4gcc8.5.0
    image: connext:7.7.0
    container_name: connext-7.7
    init: true
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      NDDSHOME: /opt/rti.com/rti_connext_dds-7.7.0
      CONNEXTDDS_ARCH: x64Linux4gcc8.5.0
      CONNEXTDDS_VERSION: 7.7.0
      PYTHON: /opt/connext-venv/bin/python
      RTI_LICENSE_FILE: /shared/rti_license.dat
    volumes:
      - ${CONNEXT_SHARED_DIR:-./shared}:/shared
      - ${CONNEXT_WORKSPACE_DIR:-.}:/workspace:ro